# Systèmes d'écriture : objets distincts des langues. Le lien vers une langue
# n'est établi que s'il est documenté (`represents`).
scripts:
  - id: tengwar
    name: Tengwar
    universe: Tolkien (légendaire)
    creator: J. R. R. Tolkien
    type: null
    type_note: "fonctionne comme alphabet ou de manière proche d'un abugida selon le « mode » ; à documenter par mode"
    direction: null
    represents: [quenya, sindarin, black_speech]
    metadata_status: unverified
    sources:
      - {url: "https://en.wikipedia.org/wiki/Tengwar", title: "Tengwar", type: encyclopedia, license: *wplicense}
  - id: cirth
    name: Cirth
