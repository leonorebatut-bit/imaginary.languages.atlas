# Catalogue initial des langues et variétés étudiées (étape 2 : sélection provisoire).
#
# AVERTISSEMENT MÉTHODOLOGIQUE
# Les métadonnées ci-dessous (créateur, année, description) proviennent de
# connaissances générales et n'ont PAS encore été vérifiées contre une source
# accessible depuis le pipeline. Chaque entrée porte donc
# `metadata_status: unverified`. Elles passeront à `verified` lorsque la collecte
# aura récupéré une source citée dans `sources` et qu'une personne l'aura relue.
# Une valeur inconnue vaut null : elle n'est jamais devinée.
#
# Le niveau de documentation est une estimation initiale de l'équipe
# (high / medium / low / fragmentary), à réviser après la collecte.
#
# Catégories (définitions dans docs/methodology.md §2) :
#   constructed_fictional   langue construite pour une œuvre de fiction, grammaire publiée
#   constructed_external    langue construite hors fiction (auxiliaire, philosophique,
#                           artistique), incluse comme point de comparaison
#   fragmentary             langue fictive attestée par un lexique ou quelques phrases
#   idiolect                manière de parler propre à un personnage
#   sociolect               variété propre à un groupe social fictif
#   transformed_variety     langue réelle transformée par un procédé (chiffrement,
#                           substitution lexicale, simplification planifiée)
#   pseudo_language         suite sonore sans grammaire ni lexique stables
#
# Les systèmes d'écriture sont décrits séparément (bloc `scripts`).

wikipedia_license: &wplicense "CC BY-SA 4.0"
tatoeba_license: &tatoebalicense "CC BY 2.0 FR"

