[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imaginary-languages-atlas"
version = "0.1.0"
description = "Cartographie et analyse typologique de langues imaginaires comparées à WALS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code) ; données : voir docs/sources.md" }
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "regex>=2023.0",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
# Analyse syntaxique automatique, uniquement pour les variétés construites sur l'anglais.
nlp = ["spacy>=3.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
